# Consulting Firm Simulation Configuration
# Models the project lifecycle with 5-deliverable workflow
# Simulates 5 years of consulting operations (Jan 2020 - Dec 2025)
#
# KEY DESIGN: Project and Deliverable have a parent-child relationship.
# Each deliverable phase uses "create" to instantiate a Deliverable entity
# (with FK back to the parent Project), then processes it as a sub event flow.

simulation:
  base_time_unit: days
  terminating_conditions: TIME(3650)
  start_date: 2020-01-01
  random_seed: 42
  # Snapshot settings — periodic CSV files written to {run_dir}/snapshots/{date}/
  # Set snapshot_enabled: false to skip all snapshot generation.
  # Common interval values: 30 (monthly), 90 (quarterly), 180 (biannual), 365 (annual)
  # snapshot_alignment:
  #   "fixed"     → exact N-day spacing (drifts with leap years)
  #   "month_end" → snap to last day of calendar month, advancing ~N/30 months
  #                 each time. Best for business reporting (Q1 close, year-end)
  snapshot_enabled: true
  snapshot_interval_days: 365
  snapshot_alignment: month_end
  resources:
    - resource_table: Consultant
      capacities:
        Junior: 1
        Mid: 1
        Senior: 1
        Lead: 1
        Principal: 1
        Executive: 1

event_simulation:
  resource_capacities:
    Consultant:
      capacity_rules:
        - resource_type: Junior
          capacity: 30
        - resource_type: Mid
          capacity: 30
        - resource_type: Senior
          capacity: 20
        - resource_type: Lead
          capacity: 10
        - resource_type: Principal
          capacity: 5
        - resource_type: Executive
          capacity: 5

  queues:
    - name: ProjectQueue
      type: FIFO

  event_flows:

    # ==========================================================
    # MAIN FLOW: Project Lifecycle (parent entity = Project)
    # ==========================================================
    - flow_id: flow_project_lifecycle
      event_flow: Project_Lifecycle
      steps:
        # Step 1: Create Project entity (~1 arrival per month)
        # This timestamp becomes Project.created_at, which post-processing
        # copies into Project_Plan.PlannedStartDate (the "contract signed" moment).
        - step_id: create_project
          step_type: create
          create_config:
            entity_table: Project_Plan
            interarrival_time:
              formula: EXPO(30)
              time_unit: days
            max_entities: n/a
          next_steps:
            - onboarding_lag

        # Step 1b: Onboarding lag — time between contract signing (planned start)
        # and actual kickoff of the first deliverable (contract review,
        # client alignment, resource scheduling). No resources required, pure delay.
        # This gap is what makes Project.ActualStartDate > Project.PlannedStartDate.
        - step_id: onboarding_lag
          step_type: event
          event_config:
            entity_table: Project_Plan
            duration:
              formula: NORM(3, 1)
              time_unit: days
          next_steps:
            - initialize_project

        # Step 2: Initialize project status
        - step_id: initialize_project
          step_type: assign
          assign_config:
            assignments:
              - assignment_type: attribute
                attribute_name: ProjectStatus
                value: Not Started
          next_steps:
            - trigger_billing_rates

        # Step 3: Generate billing rates (6 rows, one per title)
        - step_id: trigger_billing_rates
          step_type: trigger
          trigger_config:
            target_table: Project_Billing_Rate
            count: 6
            fk_column: ProjectID
          next_steps:
            - start_project

        # Step 4: Mark project as In Progress
        - step_id: start_project
          step_type: assign
          assign_config:
            assignments:
              - assignment_type: attribute
                attribute_name: ProjectStatus
                value: In Progress
          next_steps:
            - create_deliverable_1

        # Step 5: Create Deliverable 1 entity (child of Project)
        - step_id: create_deliverable_1
          step_type: create
          create_config:
            entity_table: Deliverable
            parent_fk_column: ProjectID
            attributes:
              - attribute_name: DeliverableName
                value: Project Plan Development
          next_steps:
            - trigger_title_plan_1

        # Step 5b: Generate title plan mapping for Deliverable 1
        - step_id: trigger_title_plan_1
          step_type: trigger
          trigger_config:
            target_table: Deliverable_Title_Plan_Mapping
            count: 6
            fk_column: DeliverableID
          next_steps:
            - process_deliverable_1

        # Step 6: Process Deliverable 1 - Project Plan Development (~4 weeks)
        - step_id: process_deliverable_1
          step_type: event
          event_config:
            entity_table: Deliverable
            duration:
              formula: NORM(21, 5)
              time_unit: days
            resource_requirements:
              - resource_table: Consultant
                value: Lead
                count: 1
                queue: ProjectQueue
              - resource_table: Consultant
                value: Senior
                count: 1
                queue: ProjectQueue
            bridge_table: Consultant_Deliverable_Mapping
          next_steps:
            - create_deliverable_2
            - create_deliverable_3

        # Step 7a: Create Deliverable 2 entity (parallel branch A)
        - step_id: create_deliverable_2
          step_type: create
          create_config:
            entity_table: Deliverable
            parent_fk_column: ProjectID
            attributes:
              - attribute_name: DeliverableName
                value: Design
          next_steps:
            - trigger_title_plan_2

        - step_id: trigger_title_plan_2
          step_type: trigger
          trigger_config:
            target_table: Deliverable_Title_Plan_Mapping
            count: 6
            fk_column: DeliverableID
          next_steps:
            - process_deliverable_2

        # Step 7b: Create Deliverable 3 entity (parallel branch B)
        - step_id: create_deliverable_3
          step_type: create
          create_config:
            entity_table: Deliverable
            parent_fk_column: ProjectID
            attributes:
              - attribute_name: DeliverableName
                value: Infrastructure Implementation
          next_steps:
            - trigger_title_plan_3

        - step_id: trigger_title_plan_3
          step_type: trigger
          trigger_config:
            target_table: Deliverable_Title_Plan_Mapping
            count: 6
            fk_column: DeliverableID
          next_steps:
            - process_deliverable_3

        # Step 8a: Process Deliverable 2 - Design (~4 weeks)
        - step_id: process_deliverable_2
          step_type: event
          event_config:
            entity_table: Deliverable
            duration:
              formula: NORM(21, 5)
              time_unit: days
            resource_requirements:
              - resource_table: Consultant
                value: Senior
                count: 1
                queue: ProjectQueue
              - resource_table: Consultant
                value: Mid
                count: 1
                queue: ProjectQueue
            bridge_table: Consultant_Deliverable_Mapping
          next_steps:
            - create_deliverable_4

        # Step 8b: Process Deliverable 3 - Infrastructure Implementation (~4 weeks)
        - step_id: process_deliverable_3
          step_type: event
          event_config:
            entity_table: Deliverable
            duration:
              formula: NORM(21, 5)
              time_unit: days
            resource_requirements:
              - resource_table: Consultant
                value: Mid
                count: 1
                queue: ProjectQueue
              - resource_table: Consultant
                value: Junior
                count: 2
                queue: ProjectQueue
            bridge_table: Consultant_Deliverable_Mapping
          next_steps:
            - create_deliverable_4

        # Step 9: Create Deliverable 4 entity (after BOTH Design + Infrastructure converge)
        - step_id: create_deliverable_4
          step_type: create
          create_config:
            entity_table: Deliverable
            parent_fk_column: ProjectID
            attributes:
              - attribute_name: DeliverableName
                value: Coding and Unit Test
          next_steps:
            - trigger_title_plan_4

        - step_id: trigger_title_plan_4
          step_type: trigger
          trigger_config:
            target_table: Deliverable_Title_Plan_Mapping
            count: 6
            fk_column: DeliverableID
          next_steps:
            - process_deliverable_4

        # Step 10: Process Deliverable 4 - Coding and Unit Test (~4 weeks)
        - step_id: process_deliverable_4
          step_type: event
          event_config:
            entity_table: Deliverable
            duration:
              formula: NORM(21, 5)
              time_unit: days
            resource_requirements:
              - resource_table: Consultant
                value: Mid
                count: 2
                queue: ProjectQueue
              - resource_table: Consultant
                value: Junior
                count: 3
                queue: ProjectQueue
            bridge_table: Consultant_Deliverable_Mapping
          next_steps:
            - create_deliverable_5


        # Step 12: Create Deliverable 5 entity
        - step_id: create_deliverable_5
          step_type: create
          create_config:
            entity_table: Deliverable
            parent_fk_column: ProjectID
            attributes:
              - attribute_name: DeliverableName
                value: System Test
          next_steps:
            - trigger_title_plan_5

        - step_id: trigger_title_plan_5
          step_type: trigger
          trigger_config:
            target_table: Deliverable_Title_Plan_Mapping
            count: 6
            fk_column: DeliverableID
          next_steps:
            - process_deliverable_5

        # Step 13: Process Deliverable 5 - System Test (~4 weeks)
        - step_id: process_deliverable_5
          step_type: event
          event_config:
            entity_table: Deliverable
            duration:
              formula: NORM(21, 5)
              time_unit: days
            resource_requirements:
              - resource_table: Consultant
                value: Senior
                count: 1
                queue: ProjectQueue
              - resource_table: Consultant
                value: Junior
                count: 2
                queue: ProjectQueue
            bridge_table: Consultant_Deliverable_Mapping
          next_steps:
            - trigger_expenses

        # Step 12: Generate project expenses after all deliverables complete
        - step_id: trigger_expenses
          step_type: trigger
          trigger_config:
            target_table: Actual_Project_Expense
            count: UNIF(2, 8)
            fk_column: DeliverableID
          next_steps:
            - mark_complete

        # Step 14: Mark project complete + derive all Plan/Actual fields for this project.
        # Runs inline per-project instead of as post-processing, so the derivation is
        # scoped to Entity.ProjectID (spec slide 3: "the database must track its actuals").
        # Each SQL runs only for the current project; no cross-project coupling.
        - step_id: mark_complete
          step_type: assign
          assign_config:
            assignments:
              - assignment_type: attribute
                attribute_name: ProjectStatus
                value: Complete

              # ---- Deliverable: Planned date from created_at ----
              - assignment_type: sql
                expression: |
                  UPDATE Deliverable
                  SET PlannedStartDate = DATE(created_at)
                  WHERE ProjectID = Entity.ProjectID AND PlannedStartDate IS NULL

              # ---- Deliverable: Actual dates from Consultant_Deliverable_Mapping ----
              - assignment_type: sql
                expression: |
                  UPDATE Deliverable
                  SET ActualStartDate = (
                    SELECT DATE(MIN(cdm.start_date))
                    FROM Consultant_Deliverable_Mapping cdm
                    WHERE cdm.DeliverableID = Deliverable.DeliverableID
                      AND cdm.start_date IS NOT NULL
                  )
                  WHERE ProjectID = Entity.ProjectID

              - assignment_type: sql
                expression: |
                  UPDATE Deliverable
                  SET ActualEndDate = (
                    SELECT DATE(MAX(cdm.end_date))
                    FROM Consultant_Deliverable_Mapping cdm
                    WHERE cdm.DeliverableID = Deliverable.DeliverableID
                      AND cdm.end_date IS NOT NULL
                  )
                  WHERE ProjectID = Entity.ProjectID

              # ---- Deliverable: PlannedEndDate = PlannedStart + actual duration ----
              - assignment_type: sql
                expression: |
                  UPDATE Deliverable
                  SET PlannedEndDate = DATE(
                    PlannedStartDate,
                    '+' || CAST(julianday(ActualEndDate) - julianday(ActualStartDate) AS INTEGER) || ' days'
                  )
                  WHERE ProjectID = Entity.ProjectID
                    AND PlannedStartDate IS NOT NULL
                    AND ActualStartDate IS NOT NULL
                    AND ActualEndDate   IS NOT NULL

              # ---- CDM.Month = first day of the month of start_date ----
              - assignment_type: sql
                expression: |
                  UPDATE Consultant_Deliverable_Mapping
                  SET Month = DATE(start_date, 'start of month')
                  WHERE DeliverableID IN (SELECT DeliverableID FROM Deliverable WHERE ProjectID = Entity.ProjectID)
                    AND Month IS NULL AND start_date IS NOT NULL

              # ---- Actual_Project_Expense.Date = DATE(created_at) ----
              - assignment_type: sql
                expression: |
                  UPDATE Actual_Project_Expense
                  SET Date = DATE(created_at)
                  WHERE DeliverableID IN (SELECT DeliverableID FROM Deliverable WHERE ProjectID = Entity.ProjectID)
                    AND Date IS NULL AND created_at IS NOT NULL

              # ---- Project_Plan: Planned dates ----
              - assignment_type: sql
                expression: |
                  UPDATE Project_Plan
                  SET PlannedStartDate = DATE(created_at)
                  WHERE ProjectID = Entity.ProjectID AND created_at IS NOT NULL

              - assignment_type: sql
                expression: |
                  UPDATE Project_Plan
                  SET ActualStartDate = (
                    SELECT DATE(MIN(cdm.start_date))
                    FROM Deliverable d
                    JOIN Consultant_Deliverable_Mapping cdm ON cdm.DeliverableID = d.DeliverableID
                    WHERE d.ProjectID = Entity.ProjectID AND cdm.start_date IS NOT NULL
                  )
                  WHERE ProjectID = Entity.ProjectID

              - assignment_type: sql
                expression: |
                  UPDATE Project_Plan
                  SET ActualEndDate = (
                    SELECT DATE(MAX(cdm.end_date))
                    FROM Deliverable d
                    JOIN Consultant_Deliverable_Mapping cdm ON cdm.DeliverableID = d.DeliverableID
                    WHERE d.ProjectID = Entity.ProjectID AND cdm.end_date IS NOT NULL
                  )
                  WHERE ProjectID = Entity.ProjectID

              # PlannedEndDate anchored at planned start, offset by actual duration
              - assignment_type: sql
                expression: |
                  UPDATE Project_Plan
                  SET PlannedEndDate = DATE(
                    PlannedStartDate,
                    '+' || CAST(julianday(ActualEndDate) - julianday(ActualStartDate) AS INTEGER) || ' days'
                  )
                  WHERE ProjectID = Entity.ProjectID
                    AND PlannedStartDate IS NOT NULL
                    AND ActualStartDate  IS NOT NULL
                    AND ActualEndDate    IS NOT NULL

              # ---- Project_Plan financial rollups ----
              - assignment_type: sql
                expression: |
                  UPDATE Project_Plan
                  SET PlannedHours = (
                    SELECT COALESCE(SUM(dtpm.PlannedHours), 0)
                    FROM Deliverable d
                    JOIN Deliverable_Title_Plan_Mapping dtpm ON d.DeliverableID = dtpm.DeliverableID
                    WHERE d.ProjectID = Entity.ProjectID
                  )
                  WHERE ProjectID = Entity.ProjectID

              - assignment_type: sql
                expression: |
                  UPDATE Project_Plan
                  SET PlannedExpense = (
                    SELECT ROUND(COALESCE(SUM(d.PlannedExpense), 0), 2)
                    FROM Deliverable d
                    WHERE d.ProjectID = Entity.ProjectID AND d.PlannedExpense IS NOT NULL
                  )
                  WHERE ProjectID = Entity.ProjectID

              # EstimatedBudget = SUM(PlannedHours * BillingRate) + SUM(PlannedExpense)
              - assignment_type: sql
                expression: |
                  UPDATE Project_Plan
                  SET EstimatedBudget = (
                    SELECT COALESCE(labor.total_labor, 0) + COALESCE(expense.total_expense, 0)
                    FROM (
                      SELECT SUM(dtpm.PlannedHours * COALESCE(pbr.BillingRate, 0)) AS total_labor
                      FROM Deliverable d
                      JOIN Deliverable_Title_Plan_Mapping dtpm ON d.DeliverableID = dtpm.DeliverableID
                      LEFT JOIN Project_Billing_Rate pbr
                        ON pbr.ProjectID = d.ProjectID AND pbr.TitleID = dtpm.TitleID
                      WHERE d.ProjectID = Entity.ProjectID
                    ) labor,
                    (
                      SELECT SUM(COALESCE(d2.PlannedExpense, 0)) AS total_expense
                      FROM Deliverable d2
                      WHERE d2.ProjectID = Entity.ProjectID
                    ) expense
                  )
                  WHERE ProjectID = Entity.ProjectID
          next_steps:
            - release_project

        # Step 15: Release all resources
        - step_id: release_project
          step_type: release