# Consulting Firm — Plan Generation Configuration (Step 2)
# Generates project plans BEFORE the DES execution step.
# This separates "what work enters the system" from "how work is executed."

plan_generation:
  # How projects arrive over the simulation time horizon
  arrival:
    distribution:
      formula: EXPO(30)
      time_unit: days
    simulation_duration: 3650  # days (matches sim config)
    start_date: "2020-01-01"
    random_seed: 42

  # Project templates define the structure of each project type
  templates:
    - name: consulting_project
      probability: 1.0  # Only template for now
      
      # Which table to populate for the project entity
      project_table: Project_Plan
      
      # Project-level attributes to generate
      project_attributes:
        ProjectType:
          formula: "DISC(0.5, Fixed-Price, 0.5, Time & Materials)"
        Fixed_Price_Amount:
          formula: "UNIF(50000, 500000)"
        ProjectName:
          faker: "company.catchPhrase()"
        ClientID:
          foreign_key:
            table: Client
            column: ClientID
        BusinessUnitID:
          foreign_key:
            table: Business_Unit
            column: BusinessUnitID
        ProjectStatus: "Not Started"

      # Deliverable decomposition — the work breakdown structure
      deliverables:
        table: Deliverable
        items:
          - name: Project Plan Development
            sequence: 1
            duration_estimate:
              formula: "NORM(21, 5)"
              time_unit: days
            resource_requirements:
              - resource_type: Lead
                count: 1
              - resource_type: Senior
                count: 1
            depends_on: []

          - name: Design
            sequence: 2
            duration_estimate:
              formula: "NORM(21, 5)"
              time_unit: days
            resource_requirements:
              - resource_type: Senior
                count: 1
              - resource_type: Mid
                count: 1
            depends_on: [Project Plan Development]

          - name: Infrastructure Implementation
            sequence: 3
            duration_estimate:
              formula: "NORM(21, 5)"
              time_unit: days
            resource_requirements:
              - resource_type: Mid
                count: 1
              - resource_type: Junior
                count: 2
            depends_on: [Project Plan Development]

          - name: Coding and Unit Test
            sequence: 4
            duration_estimate:
              formula: "NORM(21, 5)"
              time_unit: days
            resource_requirements:
              - resource_type: Mid
                count: 2
              - resource_type: Junior
                count: 3
            depends_on: [Design, Infrastructure Implementation]

          - name: System Test
            sequence: 5
            duration_estimate:
              formula: "NORM(21, 5)"
              time_unit: days
            resource_requirements:
              - resource_type: Senior
                count: 1
              - resource_type: Junior
                count: 2
            depends_on: [Coding and Unit Test]

      # Billing rate generation rules
      billing_rates:
        table: Project_Billing_Rate
        per_title: true  # Generate one row per title per project
        title_rates:
          101: { mean: 150, std: 20 }   # Consultant
          102: { mean: 200, std: 20 }   # Senior Consultant
          103: { mean: 250, std: 20 }   # Manager
          104: { mean: 400, std: 30 }   # Senior Manager
          105: { mean: 400, std: 30 }   # Associate Partner
          106: { mean: 500, std: 30 }   # Partner

      # Title plan mapping rules
      title_plan_mapping:
        table: Deliverable_Title_Plan_Mapping
        per_title: true  # Generate one row per title per deliverable
        planned_hours:
          formula: "UNIF(30, 120)"
